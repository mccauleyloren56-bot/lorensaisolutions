name = "agent-preflight-edge-paywall"
main = "src/index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "preflight.lorensaisolutions.com"
custom_domain = true

[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "0d42de00fef54d13a35ae3fb0e935019"

[[services]]
binding = "THREADS_AGENT"
service = "threads-miniapp-agent"

[vars]
X402_NETWORK = "eip155:8453"
X402_ASSET = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
X402_ASSET_NAME = "USD Coin"
X402_PAY_TO = "0xC83C478cc3c95d8913b90D6e55C7019aE6D04B43"
MOLTBOOK_AGENT_ID = "agent-checkout-guard"
MOLTBOOK_ENABLED = "false"
PUBLIC_BASE_URL = "https://preflight.lorensaisolutions.com"
FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"
MOLTBOOK_VERIFY_URL = "https://www.moltbook.com/api/v1/agents/verify-identity"

[observability]
enabled = true
head_sampling_rate = 1

[secrets]
required = [
  "CDP_API_KEY_ID",
  "CDP_API_KEY_SECRET"
]
